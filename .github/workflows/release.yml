name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: arena-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            binary: arena-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            binary: arena-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: arena-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Compile native binary
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.binary }}

      - name: Smoke test (native x64 only)
        if: ${{ matrix.target == 'bun-linux-x64' || matrix.target == 'bun-darwin-x64' }}
        run: |
          VER=$(dist/${{ matrix.binary }} --version)
          echo "Binary version: $VER"
          if [ -z "$VER" ]; then
            echo "ERROR: --version produced no output" >&2; exit 1
          fi
          if echo "$VER" | grep -qi "^bun"; then
            echo "ERROR: --version returned bun version string, not arena version" >&2; exit 1
          fi
          dist/${{ matrix.binary }} --help </dev/null | grep -q "arena" || {
            echo "ERROR: --help output missing 'arena'" >&2; exit 1
          }
          echo "Smoke test passed: $VER"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install
      - run: bun test
      - run: bun run build

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/native
          merge-multiple: true

      - name: Pack tarball
        run: npm pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload npm tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arena-debate-*.tgz
            dist/native/arena-*
          generate_release_notes: true
          body: |
            ## Install

            ### Shell (no npm/node required)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/tim101010101/arena/main/install.sh | bash
            ```

            Installs the native binary to `~/.local/bin/arena`. Supports macOS (arm64/x64) and Linux (arm64/x64).

            ### npm

            ```bash
            npm install -g arena-debate   # or: npx arena-debate
            ```
